<form [formGroup]="form" (ngSubmit)="eliminar()" class="form-container">
  <mat-card>
    <mat-card-title class="mat-card-title">Eliminar Cafetería</mat-card-title>

    <mat-card-content>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>ID</mat-label>
        <input matInput formControlName="id" readonly />
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="nombre" readonly />
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Ubicación</mat-label>
        <input matInput formControlName="ubicacion" readonly />
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Teléfono</mat-label>
        <input matInput formControlName="telefono" readonly />
      </mat-form-field>

    </mat-card-content>

    <mat-card-actions align="end">
      <button mat-flat-button color="warn" type="submit">
        Eliminar
      </button>
      <a mat-stroked-button routerLink="/Cafeteria">
        Cancelar
      </a>
    </mat-card-actions>
  </mat-card>
</form>
