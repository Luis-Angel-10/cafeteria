<H1>Agregar Cafeterias</H1>


<form [formGroup]="formCafeterias" (submit)="onSubmit" class="form-coontainer">

    <mat-card-title class="mat-card-tittle">Registro de Cafeterias </mat-card-title>
        <mat-card-content>
            <mat-form-field appearance="outline" class="cover-full">
                <mat-label>ID</mat-label>
                <input matInput type="text" [formControl]="formCafeterias.controls.id" maxlength="10" placeholder="0000">
            </mat-form-field>
            </mat-card-content>

             <mat-card-content>
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Nombre</mat-label>
                <input matInput type="text" [formControl]="formCafeterias.controls.nombre" maxlength="50" placeholder="Nombre completo">
            </mat-form-field>
        </mat-card-content>

         <mat-card-content>
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Nombre</mat-label>
                <input matInput type="text" [formControl]="formCafeterias.controls.ubicacion" maxlength="50" placeholder="Ubicación">
            </mat-form-field>
        </mat-card-content>

         <mat-card-content>
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Nombre</mat-label>
                <input matInput type="text" [formControl]="formCafeterias.controls.telefono" maxlength="50" placeholder="Telefono">
            </mat-form-field>
        </mat-card-content>

</form>
