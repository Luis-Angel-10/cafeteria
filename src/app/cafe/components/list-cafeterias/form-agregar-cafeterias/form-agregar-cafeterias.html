<h1>Agregar Cafetería</h1>

<form [formGroup]="formCafeterias" (submit)="onSubmit()" class="form-container">

  <mat-card-title>Registro de Cafeterías</mat-card-title>

  <mat-card-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" maxlength="50">
    </mat-form-field>
  </mat-card-content>

  <mat-card-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Ubicación</mat-label>
      <input matInput formControlName="direccion" maxlength="50">
    </mat-form-field>
  </mat-card-content>

  <mat-card-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Teléfono</mat-label>
      <input matInput formControlName="telefono" maxlength="15">
    </mat-form-field>
  </mat-card-content>

  <mat-card-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Horario</mat-label>
      <input matInput formControlName="horario">
    </mat-form-field>
  </mat-card-content>

  <mat-card-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Fecha de Registro</mat-label>
      <input matInput type="date" formControlName="fechaRegistro">
    </mat-form-field>
  </mat-card-content>

  <mat-card-actions align="end">
    <button mat-raised-button color="primary" type="submit">Guardar</button>
    <a mat-stroked-button color="warn" routerLink="/Cafeteria">Cancelar</a>
  </mat-card-actions>

</form>
