<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-container">

  <mat-card>
    <mat-card-title class="mat-card-title">Registro de Abastecimiento</mat-card-title>

    <!-- Seleccionar Cafetería -->
    <mat-card-content>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Cafetería</mat-label>

        <mat-select formControlName="cafeteriaId">
          @for (cafe of cafeteriasDataSource; track $index) {
            <mat-option [value]="cafe.id">
              {{ cafe.nombre }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </mat-card-content>

    <!-- Seleccionar Producto -->
    <mat-card-content>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Producto</mat-label>

        <mat-select formControlName="productoId">
          @for (prod of productosDataSource; track $index) {
            <mat-option [value]="prod.id">
              {{ prod.nombre }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </mat-card-content>

    <!-- Cantidad -->
    <mat-card-content>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Cantidad</mat-label>
        <input matInput type="number" formControlName="cantidad" min="1" placeholder="0">
      </mat-form-field>
    </mat-card-content>

    <!-- Botones -->
    <mat-card-actions align="end">
      <button mat-flat-button color="primary" type="submit">Guardar</button>
      <a mat-stroked-button routerLink="/abastecimientos">Cancelar</a>
    </mat-card-actions>

  </mat-card>

</form>
