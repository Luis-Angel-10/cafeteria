<a routerLink="/abastecimientos/agregar" mat-flat-button>Agregar Abastecimientos</a>

<table mat-table [dataSource]="abastecimientoDataSource" class="mat-elevation-z8">

  <!-- Foto -->
  <!-- <ng-container matColumnDef="foto">
    <th mat-header-cell *matHeaderCellDef>foto</th>
    <td mat-cell *matCellDef="let estudiante">
      <img class="foto" [src]="estudiante.foto">
    </td>
  </ng-container> -->
  <!-- id -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>Id</th>
    <td mat-cell *matCellDef="let element"> {{ element.id }} </td>
  </ng-container>

  <!-- producto -->
  <ng-container matColumnDef="producto">
    <th mat-header-cell *matHeaderCellDef>Producto</th>
    <td mat-cell *matCellDef="let element"> {{ element.producto }} </td>
  </ng-container>

  <!-- cantidad -->
  <ng-container matColumnDef="cantidad">
    <th mat-header-cell *matHeaderCellDef>cantidad</th>
    <td mat-cell *matCellDef="let element"> {{ element.cantidad }} </td>
  </ng-container>

  <!-- cafeteria -->
  <ng-container matColumnDef="cafeteria">
    <th mat-header-cell *matHeaderCellDef>Cafeteria</th>
    <td mat-cell *matCellDef="let element"> {{ element.cafeteria }} </td>
  </ng-container>

  

  

  <!-- Botones -->
  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let element">
      <a routerLink="/Abastecimientos/Actualizar/{{element.id}}" mat-flat-button color="primary">Actualizar</a>
      <button routerLink="/Abastecimientos/Eliminar/{{element.id}}" mat-flat-button color="warn">Eliminar</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
